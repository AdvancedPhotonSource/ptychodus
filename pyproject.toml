[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ptychodus"
description = "Ptychodus is a ptychography data pipeline application."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "colorcet",
    "h5py>=3",
    "hdf5plugin",
    "httpx",
    "matplotlib",
    "mlflow-skinny",
    "numpy",
    "psutil",
    "pydantic",
    "pydantic-ai>=1.0,<3",
    "pyyaml",
    "scikit-image",
    "scipy",
    "tifffile",
    "watchdog",
]
dynamic = ["version"]

[project.scripts]
convert-to-ptychodus = "ptychodus.cli.convert_to_ptychodus:main"
ptychodus = "ptychodus.__main__:main"
ptychodus-bdp = "ptychodus.cli.ptychodus_bdp:main"
ptychodus-system-check = "ptychodus.cli.ptychodus_system_check:main"
ptychodus-store = "ptychodus_store.cli:main"

[project.optional-dependencies]
docs = ["myst-parser", "sphinx", "sphinx-copybutton", "sphinx-rtd-theme"]
globus = ["globus-compute-sdk", "globus-sdk>=4.5.0"]
gui = ["PyQt5"]
#ptychonn = ["ptychonn==0.3.*,>=0.3.7"]
ptycho-fm = ["ptycho-vit"]
ptychi = ["ptychi==1.5.*"]
ptychopinn = ["ptychopinn"]
ptychozoon = ["ptychozoon"]
store = [
    "fastapi>=0.115",
    "fastmcp>=3",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pillow>=10.3",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.18",
]
xraydb = ["xraydb>=4.5"]

[tool.uv.sources]
#ptychi = { path = "../pty-chi", editable = true }
ptychopinn = { path = "../PtychoPINN", editable = true }
#ptychopinn = { git = "https://github.com/hoidn/PtychoPINN", branch = "main" }
ptycho-vit = { path = "../ptycho-vit", editable = true }

#[[tool.uv.index]]
#name = "pytorch-cu132"
#url = "https://download.pytorch.org/whl/nightly/cu132"
#explicit = true

[tool.setuptools.package-data]
"ptychodus" = ["py.typed"]
"ptychodus_store" = [
    "ui/index.html",
    "ui/styles.css",
    "ui/dist/**/*.js",
    "ui/dist/**/*.js.map",
    "ui/icons/*.svg",
    "ui/icons/README.md",
    "ui/icons/Font-Awesome-LICENSE.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.mypy]
# The unpackaged scripts/ tree has same-named modules in sibling directories
# (three genesis submit_job.py). Deriving module names from the repo root keeps
# them distinct without adding __init__.py to a tree that is never imported.
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "colorcet",
    "fastmcp.*",
    "globus_compute_sdk.*",
    "globus_sdk.*",
    "h5py",
    "hdf5plugin",
    "lightning.*",
    "ptychi.*",
    "ptycho.*",
    "ptycho_torch.*",
    "ptycho_vit.*",
    "ptychonn.*",
    "ptychozoon.*",
    "pvaccess",
    "pvapy.*",
    "scipy.*",
    "tifffile",
    "torch",
    "torch.*",
    "xraydb.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "F",
    "N",
    "NPY",
]

[tool.pymarkdown]
plugins.md003.style = "atx"      # ATX headings only, never setext
plugins.md004.style = "dash"     # dash bullets only
plugins.md029.style = "ordered"  # real incrementing ordered-list numbers
plugins.md013.enabled = false    # line length — house style is no hard wrapping
plugins.md014.enabled = false    # `$ ` shell prompts are the house convention
extensions.front-matter.enabled = true

[tool.pyright]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "mypy",
    "pymarkdownlnt",
    "pyqt5-stubs",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "types-psutil",
    "types-pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
