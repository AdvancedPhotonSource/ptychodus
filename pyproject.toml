[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ptychodus"
description = "Ptychodus is a ptychography data pipeline application."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "colorcet",
    "h5py>=3",
    "hdf5plugin",
    "httpx",
    "matplotlib",
    "mlflow-skinny",
    "numpy",
    "psutil",
    "pydantic",
    "pydantic-ai>=1.0,<3",
    "pyyaml",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "tifffile",
    "watchdog",
]
dynamic = ["version"]

[project.scripts]
convert-to-ptychodus = "ptychodus.cli.convert_to_ptychodus:main"
ptychodus = "ptychodus.__main__:main"
ptychodus-bdp = "ptychodus.cli.bdp:main"
ptychodus-reconstruct-12ide = "ptychodus.cli.reconstruct_12ide:main"
ptychodus-reconstruct-2ide = "ptychodus.cli.reconstruct_2ide:main"
ptychodus-reconstruct-atomic = "ptychodus.cli.reconstruct_atomic:main"
ptychodus-reconstruct-batch-lamni = "ptychodus.cli.reconstruct_batch_lamni:main"
ptychodus-reconstruct-bnp = "ptychodus.cli.reconstruct_bnp:main"
ptychodus-reconstruct-foldslice = "ptychodus.cli.reconstruct_foldslice:main"
ptychodus-reconstruct-isn = "ptychodus.cli.reconstruct_isn:main"
ptychodus-reconstruct-lamni = "ptychodus.cli.reconstruct_lamni:main"
ptychodus-reconstruct-pear = "ptychodus.cli.reconstruct_pear:main"
ptychodus-reconstruct-polar = "ptychodus.cli.reconstruct_polar:main"
ptychodus-reconstruct-subprocess = "ptychodus.cli.reconstruct_subprocess:main"
ptychodus-reconstruct-velociprobe = "ptychodus.cli.reconstruct_velociprobe:main"
ptychodus-system-check = "ptychodus.cli.system_check:main"
ptychodus-store = "ptychodus_store.cli:main"

# PtychoPINN, PtychoFM and PtychoNN are published on no index, so they cannot
# be named here the way ptychi is -- this table ships as the wheel's
# Requires-Dist. Install them from a checkout, after any sync:
#
#     uv pip install --no-deps -e ../PtychoPINN
#     uv pip install --no-deps -e ../ptycho-fm
#     uv pip install --no-deps -e ../PtychoNN
[project.optional-dependencies]
docs = ["myst-parser", "sphinx", "sphinx-copybutton", "sphinx-rtd-theme"]
globus = ["globus-compute-sdk", "globus-sdk>=4.5.0"]
gui = ["PyQt5"]
# pty-chi pins torch to a CUDA-matched index in its own pyproject, but uv does not
# inherit `tool.uv.sources` from a dependency, so ptychodus has to pin it again below.
ptychi = ["ptychi==2.1.*", "torch>=2.4", "torchvision"]
ptychi-cuda128 = ["ptychi==2.1.*", "torch>=2.4", "torchvision"]
ptychi-cuda130 = ["ptychi==2.1.*", "torch>=2.4", "torchvision"]
ptychi-cuda132 = ["ptychi==2.1.*", "torch>=2.4", "torchvision"]
ptychozoon = ["ptychozoon"]
store = [
    "fastapi>=0.115",
    "fastmcp>=3",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pillow>=10.3",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.18",
]
xraydb = ["xraydb>=4.5"]

[tool.setuptools.package-data]
"ptychodus" = ["py.typed"]
"ptychodus.plugins.mda" = ["xdrlib-PSF-LICENSE.txt"]
"ptychodus_store" = [
    "ui/index.html",
    "ui/styles.css",
    "ui/dist/**/*.js",
    "ui/dist/**/*.js.map",
    "ui/icons/*.svg",
    "ui/icons/README.md",
    "ui/icons/Font-Awesome-LICENSE.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.uv]
# One torch build at a time: these extras pin the same package to different indexes.
conflicts = [
    [
        { extra = "ptychi" },
        { extra = "ptychi-cuda128" },
        { extra = "ptychi-cuda130" },
        { extra = "ptychi-cuda132" },
    ],
]

# Each extra above lists torch and torchvision rather than letting them arrive through
# ptychi: uv ignores a source for a package that is not a declared dependency.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "ptychi" },
    { index = "pytorch-cu128", extra = "ptychi-cuda128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "ptychi-cuda130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu132", extra = "ptychi-cuda132", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "ptychi" },
    { index = "pytorch-cu128", extra = "ptychi-cuda128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "ptychi-cuda130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu132", extra = "ptychi-cuda132", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.mypy]
# The unpackaged scripts/ tree has same-named modules in sibling directories
# (three genesis submit_job.py), as does tests/ (two conftest.py). Deriving module
# names from the repo root keeps them distinct without adding __init__.py to trees
# that are never imported as packages.
explicit_package_bases = true
# tests/ is on the path because its shared fixture modules are imported by bare name.
mypy_path = ["src", "tests"]

[[tool.mypy.overrides]]
# Half of this module's xdrlib import pair is always unused -- [import-not-found] on
# <=3.12, [no-redef] on 3.13 -- and neither half may be removed.
module = "ptychodus.plugins.mda.mda_position_file"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "colorcet",
    "fastmcp.*",
    "globus_compute_sdk.*",
    "globus_sdk.*",
    "h5py",
    "hdf5plugin",
    "lightning.*",
    "ptychi.*",
    "ptycho.*",
    "ptycho_torch.*",
    "ptycho_fm.*",
    "ptychonn.*",
    "ptychozoon.*",
    "pvaccess",
    "pvapy.*",
    "scipy.*",
    "tensorflow.*",
    "tifffile",
    "torch",
    "torch.*",
    "xraydb.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "F",
    "N",
    "NPY",
]

[tool.pymarkdown]
plugins.md003.style = "atx"      # ATX headings only, never setext
plugins.md004.style = "dash"     # dash bullets only
plugins.md029.style = "ordered"  # real incrementing ordered-list numbers
plugins.md013.enabled = false    # line length — house style is no hard wrapping
plugins.md014.enabled = false    # `$ ` shell prompts are the house convention
plugins.md024.siblings_only = true  # same-name headings allowed under different parents
extensions.front-matter.enabled = true

[tool.pyright]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "mypy",
    "pymarkdownlnt",
    "pyqt5-stubs",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "types-psutil",
    "types-pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
