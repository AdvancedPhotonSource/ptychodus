[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ptychodus"
description = "Ptychodus is a ptychography data pipeline application."
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "colorcet",
    "h5py>=3",
    "hdf5plugin",
    "httpx",
    "matplotlib",
    "mlflow-skinny",
    "numpy",
    "psutil",
    "pydantic",
    "pydantic-ai>=1.0,<3",
    "pyyaml",
    "scikit-image",
    "scipy",
    "tifffile",
    "watchdog",
]
dynamic = ["version"]

[project.scripts]
convert-to-ptychodus = "ptychodus.scripts.convert_to_ptychodus:main"
ptychodus = "ptychodus.__main__:main"
ptychodus-bdp = "ptychodus.scripts.ptychodus_bdp:main"
ptychodus-ptychopinn-tf-test = "ptychodus.scripts.ptychopinn_tf_test:main"
ptychodus-iri-tokens = "ptychodus.scripts.genesis.ptychodus_iri_tokens:main"
ptychodus-transfer-tokens = "ptychodus.scripts.genesis.ptychodus_transfer_tokens:main"
ptychodus-system-check = "ptychodus.scripts.ptychodus_system_check:main"
ptychodus-store = "ptychodus_store.cli:main"

[project.optional-dependencies]
docs = ["sphinx", "sphinx-copybutton", "sphinx-rtd-theme"]
globus = ["globus-compute-sdk", "globus-sdk>=4.5.0"]
gui = ["PyQt5"]
#ptychonn = ["ptychonn==0.3.*,>=0.3.7"]
ptychi = ["ptychi==1.5.*"]
ptychopinn = ["ptychopinn"]
ptychozoon = ["ptychozoon"]
store = [
    "fastapi>=0.115",
    "fastmcp>=2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pillow>=10",
    "pydantic-settings>=2.5",
    "python-multipart",
]

[tool.uv.sources]
#ptychi = { path = "../pty-chi", editable = true }
#ptychopinn = { path = "../PtychoPINN", editable = true }
#ptychopinn = { git = "https://github.com/hoidn/PtychoPINN", branch = "main" }

#[[tool.uv.index]]
#name = "pytorch-cu132"
#url = "https://download.pytorch.org/whl/nightly/cu132"
#explicit = true

[tool.setuptools.package-data]
"ptychodus" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[[tool.mypy.overrides]]
module = [
    "colorcet",
    "fastmcp.*",
    "globus_compute_sdk.*",
    "globus_sdk.*",
    "h5py",
    "hdf5plugin",
    "lightning.*",
    "ptychi.*",
    "ptycho.*",
    "ptycho_torch.*",
    "ptychonn.*",
    "ptychozoon.*",
    "pvaccess",
    "pvapy.*",
    "scipy.*",
    "tifffile",
    "torch",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "F",
    "N",
    "NPY",
]

[tool.pyright]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "mypy",
    "pyqt5-stubs",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-psutil",
    "types-pyyaml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
