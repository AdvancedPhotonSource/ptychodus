[build-system]
requires = ["setuptools>=80", "setuptools_scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ptychodus"
description = "Ptychodus is a ptychography data pipeline application."
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "h5py>=3",
    "hdf5plugin",
    "matplotlib",
    "numpy",
    "psutil",
    "pyyaml",
    "requests",
    "scikit-image",
    "scipy",
    "tifffile",
    "watchdog",
]
dynamic = ["version"]

[project.scripts]
convert-to-ptychodus = "ptychodus.convert_to_ptychodus:main"
ptychodus = "ptychodus.__main__:main"
ptychodus-bdp = "ptychodus.ptychodus_bdp:main"
ptychodus-ptychopinn-tf-test = "ptychodus.scripts.ptychopinn_tf_test:main"

[project.optional-dependencies]
globus = ["globus-sdk"]
gui = ["PyQt5"]
#ptychonn = ["ptychonn==0.3.*,>=0.3.7"]
ptychi = ["ptychi==1.*,>=1.2.0"]

[tool.setuptools.package-data]
"ptychodus" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[[tool.mypy.overrides]]
module = [
    "h5py",
    "hdf5plugin",
    "lightning",
    "ptychi.*",
    "ptycho.*",
    "ptychonn.*",
    "pvaccess",
    "pvapy.*",
    "scipy.*",
    "tifffile",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "F",
    "N",
    "NPY",
]

[tool.pyright]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "mypy",
    "pyqt5-stubs",
    "pytest",
    "ruff",
    "types-psutil",
    "types-pyyaml",
    "types-requests",
]
